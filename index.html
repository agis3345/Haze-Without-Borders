<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haze Without Borders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Field-post HUD: the page borrows the game's own navy HUD panels and cream wrist notebook; haze over the scene is the one bold effect */
  --night:#10151b;
  --panel:#1a2533;
  --panel-2:#223246;
  --line:#33475f;
  --ink:#ebe6da;
  --muted:#9eabb8;
  --leaf:#4cae6c;
  --leaf-ink:#0e2416;
  --ember:#ef6b3b;
  --gold:#e9c25b;
  --paper:#f2ebda;
  --paper-ink:#2a251e;
  --paper-red:#b8472f;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1100px 520px at 25% -12%,#1f3042 0,transparent 70%),var(--night);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
img{max-width:100%;display:block}

.top{display:flex;align-items:center;gap:16px;padding:12px max(16px,3vw);border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.logo span{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--leaf);margin-top:3px}
.top .sp{flex:1}
.seg{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media (max-width:560px){.top{flex-wrap:wrap;gap:10px 12px}.logo{flex:1 1 100%}.logo b{font-size:20px}.top .sp{display:none}.top .seg{margin-right:auto}.ghost{white-space:nowrap}}
.seg button{background:transparent;border:0;padding:6px 12px;min-width:44px;font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--ink)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:14px;text-transform:uppercase}
.ghost:hover{border-color:var(--muted)}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;padding:20px max(16px,3vw) 32px;max-width:1320px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}

.stage{position:relative;aspect-ratio:960/534;border-radius:10px;overflow:hidden;background:#233;border:1px solid var(--line)}
.stage img{width:100%;height:100%;object-fit:cover}
.haze{position:absolute;inset:-10%;pointer-events:none;opacity:var(--h,0);transition:opacity 1.4s ease;background-size:180% 180%;animation:drift 26s ease-in-out infinite alternate;
  background:
    radial-gradient(120% 90% at 50% 40%,rgba(214,170,110,.55),rgba(150,105,60,.85)),
    linear-gradient(180deg,rgba(225,190,140,.6),rgba(120,80,45,.7));
  mix-blend-mode:multiply}
.haze::after{content:"";position:absolute;inset:0;background:rgba(236,214,180,.45);mix-blend-mode:screen}
@keyframes drift{from{background-position:0% 20%}to{background-position:100% 80%}}
@media (prefers-reduced-motion:reduce){.haze{transition:none;animation:none}.star svg{animation:none!important}}
.stage{box-shadow:0 18px 40px rgba(0,0,0,.45)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px rgba(0,0,0,.45);border-radius:inherit}
.strip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-top:10px}
.strip button{position:relative;padding:0;border:2px solid transparent;border-radius:5px;overflow:hidden;aspect-ratio:16/9;background:#000}
.strip img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.35);transition:filter .3s}
.strip button.seen img{filter:brightness(.75)}
.strip button.cur{border-color:var(--gold)}
.strip button.cur img{filter:none}
.strip button span{position:absolute;left:4px;bottom:2px;font-family:var(--display);font-weight:700;font-size:12px;text-shadow:0 1px 3px #000}
.strip button[disabled]{cursor:default}
.phead{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.phead .no{font-family:var(--display);font-weight:700;font-size:58px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--leaf);font-variant-numeric:tabular-nums}
.phead h2{margin:4px 0 0}
.call{display:flex;gap:12px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;max-width:68ch}
.call .av{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:#10151b}
.call small{display:block;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:12.5px}
.call q{quotes:none;font-size:18px;font-style:italic}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 14px}
.facts div{background:var(--panel-2);border-radius:8px;padding:10px 12px;border-top:3px solid var(--gold)}
.facts b{display:block;font-family:var(--display);font-weight:700;font-size:36px;line-height:1}
.facts span{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.hero-cta{margin-top:14px}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}}
.star svg{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards}
.star:nth-child(2) svg{animation-delay:.15s}.star:nth-child(3) svg{animation-delay:.3s}
.card{transform:rotate(-.6deg)}
.card dl{line-height:24px;background:repeating-linear-gradient(180deg,transparent 0 23px,#e0d5bd 23px 24px);background-position:0 8px}
.kicker span{white-space:nowrap}
@media (max-width:560px){.phead .dots{display:none}.phead .no{font-size:44px}.strip{gap:4px}.strip button span{font-size:10px}.facts b{font-size:28px}}

.hud{position:absolute;left:12px;top:12px;min-width:min(250px,60%);background:rgba(20,32,46,.92);border:1px solid rgba(255,255,255,.12);border-radius:4px;font-family:var(--display);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.hud .bar{position:relative;height:22px;background:#2a3a4d;border-bottom:1px solid rgba(255,255,255,.1)}
.hud .fill{position:absolute;inset:0 auto 0 0;background:var(--leaf);width:var(--p,50%);transition:width .6s ease}
.hud .bar span{position:relative;display:block;text-align:center;font-weight:600;font-size:14px;line-height:22px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.hud .row{display:flex;justify-content:space-between;gap:16px;padding:3px 10px;font-size:13px;letter-spacing:.04em;color:#cfd8e2}
.hud .row b{font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
.hud{opacity:.96}@media (max-width:520px){.hud{top:6px;left:6px}.hud .bar{height:18px}.hud .bar span{font-size:12px;line-height:18px}.hud .row{font-size:11px}}

.hot{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.04)}
.hot:hover{border-color:#fff;background:rgba(255,255,255,.12)}
.hot.found{border:3px solid var(--leaf);background:rgba(76,174,108,.25)}
.hot.missed{border:3px solid var(--ember);background:rgba(239,107,59,.25)}

.title-card{position:absolute;left:0;right:0;bottom:0;padding:40px clamp(14px,4%,40px) clamp(12px,3%,26px);background:linear-gradient(180deg,transparent,rgba(16,21,27,.85) 55%)}
.title-card h1{margin:0;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(21px,4.6vw,56px);line-height:.92;letter-spacing:.01em;text-wrap:balance;max-width:16ch}
.title-card p{margin:8px 0 0;font-family:var(--display);font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-size:clamp(12px,1.4vw,16px)}

.panel{margin-top:14px;background:linear-gradient(180deg,var(--panel-2),var(--panel) 120px);border:1px solid var(--line);border-top:3px solid var(--leaf);border-radius:10px;padding:18px 20px 20px}
.kicker{display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--leaf)}
.dots i.now{background:var(--gold)}
.panel h2{margin:6px 0 8px;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.panel p{margin:0 0 12px;max-width:68ch}
.quote{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:0 0 12px;font-style:italic}
.quote small{display:block;font-style:normal;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-size:13px}
.note{font-size:14px;color:var(--muted)}
.callout{background:var(--panel-2);border-radius:6px;padding:8px 12px;font-size:15px;margin:0 0 12px;max-width:68ch}
.callout b{color:var(--gold)}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{border:0;border-radius:6px;padding:11px 18px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;background:var(--leaf);color:var(--leaf-ink);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.35;cursor:not-allowed;filter:none}
.btn.alt{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
.btn.blue{background:#3f86c9;color:#fff}
.btn.done{background:transparent;color:var(--leaf);border:1px solid var(--leaf);box-shadow:none}

.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:4px 0 12px}
.choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice:hover{border-color:var(--leaf)}
.choice b{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.choice span{font-size:14px;color:var(--muted)}
.choice.picked{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:4px 0 12px}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.stat{background:var(--panel-2);border-radius:8px;padding:10px 12px}
.stat small{display:block;font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat em{font-style:normal;font-size:13px;display:block}
.good{color:var(--leaf)}.bad{color:var(--ember)}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.compare .stat b{font-size:40px}

.stars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 14px;background:#16233a;border:2px solid var(--gold);border-radius:10px;padding:14px}
.star{text-align:center}
.star svg{width:46px;height:46px}
.star b{display:block;font-family:var(--display);font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.star span{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.badge{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-family:var(--display);font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:14px}
.badge i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;background:var(--line);color:var(--muted)}
.badge.on i{background:var(--gold);color:#3a2a00}
.badge:not(.on){color:var(--muted)}
.quiz{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.quiz h3{margin:0 0 8px;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.q{margin:0 0 12px}
.q p{margin:0 0 6px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--paper);color:var(--paper-ink);border:2px solid transparent;border-radius:6px;padding:8px 12px;font-size:15px}
.opt.right{border-color:var(--leaf);background:#dff0e2}
.opt.wrong{border-color:var(--ember);background:#f6ddd2}
.fb{font-size:14px;margin-top:6px}

/* Wrist notebook */
.notebook{align-self:start;position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.notebook{position:static}}
.card{background:var(--paper);color:var(--paper-ink);border-radius:4px;box-shadow:0 6px 0 rgba(0,0,0,.25);overflow:hidden}
.card header{background:#3a3128;color:#f2ebda;font-family:var(--display);font-weight:600;letter-spacing:.06em;font-size:16px;padding:6px 12px}
.card dl{margin:0;padding:8px 12px 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.card dt{color:#6d6457}
.card dd{margin:0;font-variant-numeric:tabular-nums}
.card .safe{color:var(--paper-red);font-size:13.5px;padding:0 12px 10px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;color:var(--muted)}
.mini b{color:var(--ink)}
.mini p{margin:0 0 8px}
.mini p:last-child{margin:0}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--line);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><b>Haze Without Borders</b><span id="tag">Kalimantan peat mission</span></div>
  <div class="sp"></div>
  <div class="seg" role="group" aria-label="Language">
    <button id="lang-en" type="button" data-act="lang" data-v="en">EN</button>
    <button id="lang-id" type="button" data-act="lang" data-v="id">ID</button>
  </div>
  <button class="ghost" id="fsbtn" type="button" data-act="fs">Full screen</button>
</div>

<div class="wrap">
  <main>
    <div class="stage" id="stage">
      <img id="scene" alt="">
      <div class="haze" id="haze"></div>
      <div id="overlay"></div>
    </div>
    <div class="strip" id="strip" aria-label="Scenes"></div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
  <aside class="notebook" id="notebook"></aside>
</div>
<div class="toast" id="toast" role="status"></div>

   p:"Belah tanahnya. Di lokasi basah, muka air hanya sekitar 10 cm di bawah permukaan, jadi gambut tetap jenuh air dan tidak terbakar. Di Site A, kanal sudah menurunkan air sampai 62 cm, dan semua lapisan di atasnya mengering menjadi bahan bakar.",
   c:"<b>Patokan:</b> muka air lebih dalam dari 40 cm berarti risiko kebakaran naik cepat.",go:"Cari apinya"},
 s4:{t:"Pemindai termal",obj:"Temukan bara tersembunyi",emb:"Bara",
   p:"Api gambut bisa membara di bawah tanah berminggu-minggu tanpa nyala yang terlihat. Ketuk tiga titik panas di pemindai sebelum waktu habis.",
   ok:"Ketiga bara ditemukan. Semuanya berada di tempat muka air lebih dalam dari 40 cm.",
   late:"Waktu habis. Pemindai menandai bara yang terlewat dengan warna oranye. Tidak ada game over, jadi lanjutkan saja.",found:"Ketemu"},
 s5:{t:"Sekat kanal",obj:"Bangun sekat kanal",planks:"Papan",bags:"Karung",
   pick:"Bahanmu cukup untuk satu sekat. Kanal mana yang kamu bendung?",
   A:"Site A",Ad:"−62 cm · mengeringkan 120 ha",B:"Site B",Bd:"−48 cm · mengeringkan 40 ha",
   build:"Bangun dengan tangan: lima papan melintang kanal, empat karung pasir di dasarnya.",plank:"Pasang papan",bag:"Pasang karung",
   leak:"Bocor! Air merembes lewat celah di tepi sekat.",seal:"Tutup celahnya",sealD:"Sumpal celah dengan gambut dan karung terakhir.",skip:"Biarkan",skipD:"Waktu mepet; sekatnya sebagian besar menahan.",
   sealed:"Tertutup rapat. Air di belakang sekat mulai naik.",leaky:"Sekatnya berdiri, tapi air terus lolos."},
 s6:{t:"Ibu Sari",obj:"Bicara dengan Ibu Sari",choose:"Pilih 1 dari 3",who:"Ibu Sari · petani kecil",q:"“Saya harus membersihkan lahan sebelum hujan. Membakar adalah cara paling murah.”",
   help:"Atur bantuan tanpa bakar",helpD:"Hubungkan dengan tim desa yang membuka lahan secara manual.",
   crops:"Sarankan tanaman gambut basah",cropsD:"Hanya berhasil jika lahannya dibasahi ulang sampai dalam 40 cm.",
   let:"Biarkan dia memutuskan",letD:"Hormati pilihannya dan lanjut.",
   rHelp:"Dia setuju mencobanya musim ini. Api pembukaan lahannya dicoret dari daftar.",
   rCropsOk:"Lahannya dekat Site A yang sudah kamu basahi ulang. Dia menanam, bukan membakar.",
   rCropsNo:"Lahannya dekat Site A masih terlalu kering untuk tanaman gambut basah. Dia tetap membakar.",
   rLet:"Dia membakar lahannya seperti setiap tahun."},
 s7:{t:"Musim yang sama, dua kali",obj:"Putar ulang musim kemarau",hud:"Ulang · Hari 38 dari 60",
   p:"Jalankan musim kemarau yang sama dua kali. Cuaca sama, angin sama, titik api sama. Hanya pilihanmu yang berbeda.",
   base:"Baseline",yours:"Dengan pilihanmu",burnt:"Gambut terbakar",haze:"Hari berkabut di Kuching",water:"Muka air di Site A",waterB:"Muka air di sekatmu",ofBase:"dari baseline"},
 s8:{t:"Langit Kuching",obj:"Baseline vs pilihanmu",hud:"Hari 60 dari 60",
   base:"Baseline",yours:"Pilihanmu",days:"hari berkabut",school:"hari sekolah hilang",
   good:"“Kami bisa sekolah hampir setiap hari!”",mid:"“Lebih baik dari tahun lalu, tapi hari berasapnya masih banyak.”",go:"Lihat nilai misiku"},
 s9:{t:"Nilai misi",obj:"Bintang, lencana, dan debrief",
   water:"Air",waterD:"Gambut di sekatmu dalam 40 cm",fire:"Api",fireD:"Gambut terbakar paling banyak separuh baseline",air:"Udara",airD:"Hari berkabut paling banyak separuh baseline",
   badges:["Detektif Gambut","Penjaga Air","Tetangga Baik","Langit Cerah"],
   debrief:"Debrief",
   q1:"Kenapa sekat di Site A lebih berdampak daripada di Site B?",q1o:["Kanalnya mengeringkan lebih banyak gambut: 120 ha, air di −62 cm","Lebih dekat ke Kuching","Pohon di sekitarnya lebih banyak"],
   q1w:"Belum tepat. Kanal Site A mengeringkan area tiga kali lebih luas dan menurunkan air jauh lebih dalam.",
   q2:"Kenapa apinya tidak terlihat dari jalan papan?",q2o:["Api membara di bawah tanah dalam gambut kering","Api hanya menyala malam hari","Kabut menutupi nyalanya"],
   q2w:"Belum tepat. Api gambut merambat di bawah tanah lewat gambut kering, makanya kamu butuh pemindai.",
   right:"Benar.",replay:"Main lagi dengan pilihan lain",home:"Kembali ke awal"},
 nb:{h:"Catatan pergelangan",a:"Site A",b:"Site B",emb:"Bara",block:"Sekat",sari:"Ibu Sari",safe:"Batas aman: dalam 40 cm",
   sealed:"rapat",leaky:"bocor",help:"bantuan tanpa bakar",cropsOk:"tanaman gambut basah",cropsNo:"tanaman gagal, dibakar",let:"dibakar",
   aboutH:"Tentang demo ini",
   about:"Halaman ini menelusuri sembilan adegan prototipe sesuai urutan di concept note. Versi VR-nya menghubungkan pilihan pemain dengan model skenario GAMA untuk muka air tanah, sebaran api, dan asap.",
   team:"Tim NUSAVERSE · UPI · Mentor: Raden Deasy Mandasari"}
}};

const EMBERS=[[40.2,72.5],[50.8,68],[48.5,80.5]];
const BLOCK={A:{sealed:[6,45,-32],leaky:[3,25,-45]},B:{sealed:[2,15,-24],leaky:[1,8,-41]}};
const BASE={haze:14,burnt:100,water:-62};

function fresh(lang){return{step:0,maxStep:0,lang:lang||"en",logA:false,logB:false,embers:[0,0,0],timeLeft:30,emberDone:false,site:null,planks:0,bags:0,quality:null,sari:null,view:"yours",quiz:{}};}
let S=fresh();
let timer=null;

function outcome(){
  let haze=BASE.haze,burnt=BASE.burnt,water=null;
  if(S.site&&S.quality){const b=BLOCK[S.site][S.quality];haze-=b[0];burnt-=b[1];water=b[2];}
  const rewetA=S.site==="A"&&S.quality==="sealed";
  const sariOff=S.sari==="help"||(S.sari==="crops"&&rewetA);
  if(sariOff){haze-=5;burnt-=30;}
  return{haze,burnt,water,sariOff,rewetA,stars:{water:water!==null&&water>=-40,fire:burnt<=50,air:haze<=7}};
}

const $=id=>document.getElementById(id);
const t=()=>T[S.lang];

function hud(barText,pct,left,right){
  return `<div class="hud" style="--p:${pct}%"><div class="bar"><div class="fill"></div><span>${barText}</span></div><div class="row"><span>${left}</span><b>${right||""}</b></div></div>`;
}
function kicker(n){
  let d="";for(let i=1;i<=9;i++)d+=`<i class="${i<n?"on":i===n?"now":""}"></i>`;
  return `<div class="kicker"><span>${t().scene} ${n} ${t().of} 9</span><div class="dots" aria-hidden="true">${d}</div></div>`;
}
function nav(n,nextOk,nextLabel,nextAct){
  return `<div class="actions">${n>1?`<button class="btn alt" type="button" data-act="go" data-v="${n-1}">${t().back}</button>`:""}<button class="btn" type="button" data-act="${nextAct||"go"}" data-v="${n+1}" ${nextOk?"":"disabled"}>${nextLabel||t().next}</button></div>`;
}
function head(n,title){return `<div class="phead"><div class="no" aria-hidden="true">0${n}</div><div>${kicker(n)}<h2>${title}</h2></div></div>`;}
function call(who,q,init,col){return `<div class="call"><div class="av" style="background:${col}">${init}</div><div><small>${who}</small><q>${q}</q></div></div>`;}
function starSvg(on){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="${on?"var(--gold)":"none"}" stroke="${on?"var(--gold)":"#5b6b7e"}" stroke-width="1.5"/></svg>`;}

function render(){
  const L=t(), n=S.step, o=outcome();
  document.documentElement.lang=S.lang;
  $("tag").textContent=L.tag;
  $("lang-en").setAttribute("aria-pressed",S.lang==="en");
  $("lang-id").setAttribute("aria-pressed",S.lang==="id");
  $("fsbtn").textContent=document.fullscreenElement?L.fsx:L.fs;
  const img=$("scene"); const src=IMG[n===0?1:n]; if(img.getAttribute("src")!==src)img.src=src;
  img.alt=n===0?L.introH:L["s"+n].t;
  let h=0, ov="", body="";

  if(n===0){
    h=.62;
    ov=`<div class="title-card"><h1>${L.introH}</h1><p>${L.introSub}</p></div>`;
    body=`<div class="kicker"><span>Haze Without Borders</span></div>
      <p style="margin-top:8px">${L.introP}</p>
      <div class="facts">${L.introFacts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}</div>
      <p class="note">${L.introNote}</p>
      <div class="actions"><button class="btn" type="button" data-act="go" data-v="1">${L.start}</button></div>`;
  }
  if(n===1){const s=L.s1;h=.35;
    ov=hud(L.day(1),2,s.t,s.obj);
    body=`${head(1,s.t)}${call(s.who,s.q,"A","#7fb6e8")}<p>${s.p}</p>${nav(1,true,s.go)}`;}
  if(n===2){const s=L.s2,c=(S.logA?1:0)+(S.logB?1:0);
    ov=hud(L.nino(41),32,s.t,`${s.logged} ${c}/2`);
    body=`${head(2,s.t)}<p>${s.p}</p>
     <div class="actions" style="margin-bottom:10px">
      <button class="btn ${S.logA?"done":"blue"}" type="button" data-act="log" data-v="A">${S.logA?"✓ Site A: "+s.ra:s.a}</button>
      <button class="btn ${S.logB?"done":"blue"}" type="button" data-act="log" data-v="B">${S.logB?"✓ Site B: "+s.rb:s.b}</button></div>
     ${nav(2,c===2)}`;}
  if(n===3){const s=L.s3;
    ov=hud(L.nino(38),37,s.t,s.obj);
    body=`${head(3,s.t)}<p>${s.p}</p><div class="callout">${s.c}</div>${nav(3,true,s.go)}`;}
  if(n===4){const s=L.s4,f=S.embers.filter(Boolean).length;
    const mm=String(Math.floor(S.timeLeft/60)), ss=String(S.timeLeft%60).padStart(2,"0");
    ov=hud(`${mm}:${ss}`,S.timeLeft/30*100,s.obj,`${s.emb} ${f}/3`)+
      EMBERS.map((e,i)=>`<button class="hot ${S.embers[i]?"found":(S.emberDone?"missed":"")}" type="button" style="left:${e[0]}%;top:${e[1]}%" data-act="ember" data-v="${i}" aria-label="${s.emb} ${i+1}${S.embers[i]?" · "+s.found:""}"></button>`).join("");
    const msg=S.emberDone?`<div class="callout">${f===3?s.ok:s.late}</div>`:"";
    body=`${head(4,s.t)}<p>${s.p}</p>${msg}${nav(4,S.emberDone)}`;}
  if(n===5){const s=L.s5;
    ov=hud(L.nino(33),45,s.obj,`${s.planks} ${S.planks}/5 · ${s.bags} ${S.bags}/4`);
    let inner="";
    if(!S.site){inner=`<p>${s.pick}</p><div class="choices">
       <button class="choice" type="button" data-act="site" data-v="A"><b>${s.A}</b><span>${s.Ad}</span></button>
       <button class="choice" type="button" data-act="site" data-v="B"><b>${s.B}</b><span>${s.Bd}</span></button></div>`;}
    else if(S.planks<5||S.bags<4){inner=`<div class="callout"><b>${S.site==="A"?s.A:s.B}</b> · ${S.site==="A"?s.Ad:s.Bd}</div><p>${s.build}</p>
       <div class="actions" style="margin-bottom:10px">
        <button class="btn blue" type="button" data-act="plank" ${S.planks>=5?"disabled":""}>${s.plank} ${S.planks}/5</button>
        <button class="btn blue" type="button" data-act="bag" ${S.bags>=4?"disabled":""}>${s.bag} ${S.bags}/4</button></div>`;}
    else if(!S.quality){inner=`<div class="callout" style="border-left:3px solid var(--ember)">${s.leak}</div><div class="choices">
       <button class="choice" type="button" data-act="quality" data-v="sealed"><b>${s.seal}</b><span>${s.sealD}</span></button>
       <button class="choice" type="button" data-act="quality" data-v="leaky"><b>${s.skip}</b><span>${s.skipD}</span></button></div>`;}
    else{inner=`<div class="callout"><b>${S.site==="A"?s.A:s.B}</b> · ${S.quality==="sealed"?s.sealed:s.leaky}</div>`;}
    body=`${head(5,s.t)}${inner}${nav(5,!!S.quality)}`;}
  if(n===6){const s=L.s6;
    ov=hud(L.nino(30),50,s.obj,s.choose);
    const opt=(k)=>`<button class="choice ${S.sari===k?"picked":""}" type="button" data-act="sari" data-v="${k}" ${S.sari?"disabled":""}><b>${s[k]}</b><span>${s[k+"D"]}</span></button>`;
    let r="";if(S.sari){r=S.sari==="help"?s.rHelp:S.sari==="let"?s.rLet:(o.rewetA?s.rCropsOk:s.rCropsNo);r=`<div class="callout">${r}</div>`;}
    body=`${head(6,s.t)}${call(s.who,s.q,"S","var(--gold)")}<div class="choices">${opt("help")}${opt("crops")}${opt("let")}</div>${r}${nav(6,!!S.sari)}`;}
  if(n===7){const s=L.s7, b=S.view==="base";
    const haze=b?BASE.haze:o.haze, burnt=b?BASE.burnt:o.burnt;
    const w=b?BASE.water:(o.water??BASE.water);
    h=(haze/14)*.55;
    ov=hud(s.hud,63,b?s.base:s.yours,"");
    body=`${head(7,s.t)}<p>${s.p}</p>
     <div class="seg" role="group" aria-label="${s.t}" style="display:inline-flex;margin-bottom:12px">
      <button type="button" data-act="view" data-v="base" aria-pressed="${b}">${s.base}</button>
      <button type="button" data-act="view" data-v="yours" aria-pressed="${!b}">${s.yours}</button></div>
     <div class="stats">
      <div class="stat"><small>${s.burnt}</small><b class="${burnt<=50?"good":"bad"}">${burnt}%</b><em>${s.ofBase}</em></div>
      <div class="stat"><small>${s.haze}</small><b class="${haze<=7?"good":"bad"}">${haze}</b><em>/ 14</em></div>
      <div class="stat"><small>${b||!S.site?s.water:s.waterB}</small><b class="${w>=-40?"good":"bad"}">${w} cm</b><em>${L.nb.safe}</em></div></div>
     ${nav(7,true)}`;}
  if(n===8){const s=L.s8;
    ov=hud(s.hud,100,s.obj,"");
    body=`${head(8,s.t)}
     <div class="compare">
      <div class="stat"><small>${s.base}</small><b class="bad">14</b><em>${s.days} · 14 ${s.school}</em></div>
      <div class="stat"><small>${s.yours}</small><b class="${o.haze<=7?"good":"bad"}">${o.haze}</b><em>${s.days} · ${o.haze} ${s.school}</em></div></div>
     ${call("Aiman · Kuching",o.haze<=7?s.good:s.mid,"A","#7fb6e8")}
     ${nav(8,true,s.go)}`;}
  if(n===9){const s=L.s9, st=o.stars;
    const bd=[S.logA&&S.logB&&S.embers.every(Boolean),S.quality==="sealed",o.sariOff,st.air];
    const icons=["⌕","💧","♥","☀"];
    const q=(k,opts,wrong)=>{const a=S.quiz[k];return `<div class="q"><p>${s[k]}</p><div class="opts">${(k==="q1"?[1,0,2]:[2,1,0]).map(i=>[opts[i],i]).map(([x,i])=>`<button class="opt ${a===undefined?"":i===0?"right":a===i?"wrong":""}" type="button" data-act="quiz" data-k="${k}" data-v="${i}" ${a!==undefined?"disabled":""}>${x}</button>`).join("")}</div>${a===undefined?"":`<div class="fb ${a===0?"good":"bad"}">${a===0?s.right:wrong}</div>`}</div>`;};
    ov=hud(L.s8.hud,100,s.t,`${Object.values(st).filter(Boolean).length}/3 ★`);
    body=`${head(9,s.t)}
     <div class="stars">
      <div class="star">${starSvg(st.water)}<b>${s.water}</b><span>${s.waterD}</span></div>
      <div class="star">${starSvg(st.fire)}<b>${s.fire}</b><span>${s.fireD}</span></div>
      <div class="star">${starSvg(st.air)}<b>${s.air}</b><span>${s.airD}</span></div></div>
     <div class="badges">${s.badges.map((x,i)=>`<span class="badge ${bd[i]?"on":""}"><i>${icons[i]}</i>${x}</span>`).join("")}</div>
     <div class="quiz"><h3>${s.debrief}</h3>${q("q1",s.q1o,s.q1w)}${q("q2",s.q2o,s.q2w)}</div>
     <div class="actions"><button class="btn" type="button" data-act="replay">${s.replay}</button><button class="btn alt" type="button" data-act="home">${s.home}</button></div>`;}

  let st="";for(let i=1;i<=9;i++){const ok=i<=S.maxStep;st+=`<button type="button" class="${i===n?"cur":""} ${ok?"seen":""}" ${ok&&i!==n?`data-act="go" data-v="${i}"`:"disabled"} aria-label="${L.scene} ${i}"><img src="${IMG[i]}" alt=""><span>${i}</span></button>`;}
  if($("strip").dataset.k!==n+"|"+S.maxStep+"|"+S.lang){$("strip").innerHTML=st;$("strip").dataset.k=n+"|"+S.maxStep+"|"+S.lang;}
  $("haze").style.setProperty("--h",h);
  $("overlay").innerHTML=ov;
  $("panel").innerHTML=body;
  renderNotebook(o);
}

function renderNotebook(o){
  const N=t().nb, s2=t().s2;
  const dash="—";
  const block=S.site&&S.quality?`${S.site} · ${N[S.quality]}`:(S.site?`${S.site} · …`:dash);
  const sari=!S.sari?dash:S.sari==="help"?N.help:S.sari==="let"?N.let:(o.rewetA?N.cropsOk:N.cropsNo);
  $("notebook").innerHTML=`
   <div class="card"><header>${N.h}</header>
    <dl>
     <dt>${N.a}</dt><dd>${S.logA?s2.ra:dash}</dd>
     <dt>${N.b}</dt><dd>${S.logB?s2.rb:dash}</dd>
     <dt>${N.emb}</dt><dd>${S.step>=4?S.embers.filter(Boolean).length+"/3":dash}</dd>
     <dt>${N.block}</dt><dd>${block}</dd>
     <dt>${N.sari}</dt><dd>${sari}</dd>
    </dl>
    <div class="safe">${N.safe}</div></div>
   <div class="mini"><p><b>${N.aboutH}</b></p><p>${N.about}</p><p>${N.team}</p></div>`;
}

function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function startTimer(){
  stopTimer();
  if(S.emberDone)return;
  timer=setInterval(()=>{
    S.timeLeft=Math.max(0,S.timeLeft-1);
    if(S.timeLeft===0){S.emberDone=true;stopTimer();}
    render();
  },1000);
}
function go(n){
  S.step=Math.max(0,Math.min(9,n));S.maxStep=Math.max(S.maxStep||0,S.step);
  if(S.step===4)startTimer();else stopTimer();
  render();
  if(window.innerWidth<900)$("stage").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2200);}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==="lang"){S.lang=v;render();return;}
  if(a==="fs"){
    try{
      if(document.fullscreenElement){document.exitFullscreen();}
      else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
        if(p&&p.catch)p.catch(()=>toast(t().fsno));else if(!p)toast(t().fsno);}
    }catch(err){toast(t().fsno);}
    return;}
  if(a==="go"){go(+v);return;}
  if(a==="log"){if(v==="A")S.logA=true;else S.logB=true;render();return;}
  if(a==="ember"){if(S.emberDone)return;S.embers[+v]=1;if(S.embers.every(Boolean)){S.emberDone=true;stopTimer();}render();return;}
  if(a==="site"){S.site=v;render();return;}
  if(a==="plank"){S.planks=Math.min(5,S.planks+1);render();return;}
  if(a==="bag"){S.bags=Math.min(4,S.bags+1);render();return;}
  if(a==="quality"){S.quality=v;render();return;}
  if(a==="sari"){S.sari=v;render();return;}
  if(a==="view"){S.view=v;render();return;}
  if(a==="quiz"){S.quiz[b.dataset.k]=+v;render();return;}
  if(a==="replay"){const l=S.lang;S=fresh(l);S.logA=S.logB=true;S.embers=[1,1,1];S.emberDone=true;go(5);return;}
  if(a==="home"){const l=S.lang;S=fresh(l);go(0);return;}
});
document.addEventListener("fullscreenchange",render);

function start(data){
  if(data&&typeof data.step==="number")S=Object.assign(fresh(),data);
  window.claude?.hot?.snapshot?.(()=>JSON.parse(JSON.stringify(S)));
  go(S.step);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
</body>
